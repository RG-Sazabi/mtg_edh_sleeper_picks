[flake8]
# Align with black's formatting (88-char lines; E203/W503 conflict with black).
max-line-length = 88
extend-ignore = E203, W503
extend-exclude = .venv, venv, env, cache, docs, __pycache__, .git, .claude

[tool:pytest]
testpaths = tests
pythonpath = .
# Live canary tests hit the real services; deselected unless run with -m live.
addopts = -m "not live"
markers =
    live: hits the real EDHRec / Archidekt / Scryfall endpoints (run: pytest -m live)
